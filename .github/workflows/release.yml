name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v7
        with:
          name: bt-toggle
          path: target/release/bt-toggle.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" target/release/bt-toggle.exe --title "${{ github.ref_name }}" --generate-notes
